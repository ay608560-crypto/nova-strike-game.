    ctx.save();
    ctx.translate(this.x, this.y);

    // Overdrive golden aura
    if (overdriveActive > 0) {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow('#ffdd33', 0, 0, 62 + Math.sin(gTime * 20) * 8, 0.55);
      ctx.strokeStyle = `rgba(255, 240, 120, ${0.7 + Math.sin(gTime * 18) * 0.25})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 44 + Math.sin(gTime * 12) * 3, 0, 6.283); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.globalCompositeOperation = 'lighter';
    drawGlow(this.ship.color, 0, 12, 34, 0.35);
    ctx.globalCompositeOperation = 'source-over';

    if (invulnerable > 0 && Math.floor(invulnerable * 12) % 2 === 0) ctx.globalAlpha = 0.35;
    renderShipModel(ctx, this.ship.id, this.tilt, gTime, overdriveActive > 0);
    ctx.restore();
    ctx.globalAlpha = 1;

    // Shield
    if (this.shield > 0 && (this.shield > 2 || Math.floor(this.shield * 10) % 2 === 0)) {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow('#00aaff', this.x, this.y, 55, 0.38);
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = `rgba(120,240,255,${0.6 + Math.sin(gTime * 8) * 0.3})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, 43, 0, 6.283); ctx.stroke();
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(gTime * 2.2);
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 47, 0, 1.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 47, Math.PI, Math.PI + 1.1); ctx.stroke();
      ctx.restore();
    }

    // Precision hitbox core
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y + 2, 3, 0, 6.283); ctx.fill();
  }
}

// ==================== GAME LOGIC ====================
const killsNeeded = () => 18 + level * 6;
const multiplier = () => Math.min(8, 1 + Math.floor(comboCount / 5));

function addScore(pts, useMul = true) {
  const v = useMul ? pts * multiplier() : pts;
  score += v;
  return v;
}

function addOverdrive(amt) {
  if (overdriveActive > 0) return;
  const mul = (player && player.ship.odBonus) ? player.ship.odBonus : 1;
  const prev = overdrive;
  overdrive = Math.min(100, overdrive + amt * mul);
  if (prev < 100 && overdrive >= 100) {
    floatText(player.x, player.y - 45, 'OVERDRIVE READY!', '#00ffbb', 16);
    sfx('power');
  }
}

function useOverdrive() {
  if (gameState !== STATE.PLAY || !player || player.dead || overdrive < 100 || overdriveActive > 0) return;
  overdrive = 0;
  overdriveActive = 6.5;
  invulnerable = Math.max(invulnerable, 1.2);
  sfx('overdrive');
  shake(14);
  flashScreen('#00ffbb', 0.45);
  showBanner('NOVA OVERDRIVE!', 'MAX HYPER FIRE', '#00ffbb');
  particles.push(new Particle(player.x, player.y, '#00ffbb', { type: 'ring', vx: 0, vy: 0, size: 14, grow: 900, life: 0.55, drag: 0 }));
}

function showBanner(title, sub, color = '#00e5ff') {
  const b = $('banner');
  $('bannerTitle').textContent = title;
  $('bannerSub').textContent = sub || '';
  b.style.setProperty('--bc', color);
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

function startGame() {
  initAudio();
  sfx('start');
  ['startScreen', 'gameOverScreen', 'pauseScreen'].forEach(id => $(id).style.display = 'none');
  $('hud').style.display = 'flex';
  $('bottomHud').style.display = 'flex';
  $('bossBar').style.display = 'none';
  const ship = currentShip();
  score = 0; lives = ship.lives; bombs = ship.bombs;
  level = 1; kills = 0; killsThisLevel = 0;
  phase = 'wave'; phaseTimer = 0;
  comboCount = 0; comboTimer = 0; maxCombo = 0;
  overdrive = 25; overdriveActive = 0;
  pBullets = []; eBullets = []; enemies = []; particles = []; texts = []; powerups = []; coins = []; boss = null;
  player = new Player(ship);
  spawnTimer = 1.4; bossMinionTimer = 3; invulnerable = 1.6;
  shakeMag = 0; deathTimer = 0; flash.a = 0;
  warp = 2; warpTarget = 0; pointer.active = false;
  hudCache = {};
  gameState = STATE.PLAY;
  showBanner('STAGE 1', ship.name + ' DEPLOYED!', ship.color);
}

function goMenu() {
  gameState = STATE.MENU;
  ['gameOverScreen', 'pauseScreen'].forEach(id => $(id).style.display = 'none');
  $('hud').style.display = 'none';
  $('bottomHud').style.display = 'none';
  $('bossBar').style.display = 'none';
  $('startScreen').style.display = 'flex';
  $('bestMenu').textContent = 'HIGH SCORE: ' + highScore.toLocaleString();
  warpTarget = 0.3;
}

function togglePause() {
  if (gameState === STATE.PLAY) {
    gameState = STATE.PAUSE;
    $('pauseScreen').style.display = 'flex';
    pointer.active = false;
  } else if (gameState === STATE.PAUSE) {
    gameState = STATE.PLAY;
    $('pauseScreen').style.display = 'none';
    lastTime = 0;
  }
}

function useBomb() {
  if (gameState !== STATE.PLAY || !player || player.dead || bombs <= 0) return;
  bombs--;
  sfx('bomb'); shake(25); flashScreen('#ffffff', 0.85);
  invulnerable = Math.max(invulnerable, 1.1);
  eBullets.forEach(b => sparks(b.x, b.y, b.color, 2));
  const cleared = eBullets.length;
  eBullets = [];
  if (cleared) {
    const v = addScore(cleared * 10, false);
    floatText(player.x, player.y - 60, 'BULLETS CLEARED +' + v, '#ffffff', 14);
  }
  for (let i = 0; i < 3; i++) {
    particles.push(new Particle(player.x, player.y, i === 0 ? '#ffffff' : '#ff4466', {
      type: 'ring', vx: 0, vy: 0, size: 10 + i * 20, grow: 1400 - i * 300, life: 0.7, drag: 0
    }));
  }
  enemies.forEach(e => { if (!e.dead) damageEnemy(e, 18); });
  if (boss && !boss.dying && !boss.entering) damageBoss(Math.round(boss.maxHp * 0.09) + 32);
}

function damageEnemy(e, dmg) {
  e.hp -= dmg; e.flash = 0.06;
  if (e.hp <= 0 && !e.dead) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true; kills++;
  if (phase === 'wave') killsThisLevel++;
  comboCount++; comboTimer = 2.6;
  maxCombo = Math.max(maxCombo, comboCount);
  addOverdrive(e.type === 'tank' || e.type === 'elite' ? 7 : 3);
  if (comboCount % 5 === 0 && multiplier() > 1) {
    const m = $('comboMul');
    m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
  }
  const v = addScore(e.score);
  floatText(e.x, e.y, '+' + v, multiplier() > 1 ? '#ffcc00' : '#ffffff', 14 + Math.min(8, multiplier()));
  createExplosion(e.x, e.y, e.color, e.size / 22);
  sfx('explode');
  if (e.type === 'tank' || e.type === 'elite') shake(8);

  // Drop energy star coins
  const coinCount = e.type === 'grunt' ? 1 : (e.type === 'tank' || e.type === 'elite' ? 4 : 2);
  for (let i = 0; i < coinCount; i++) coins.push(new Coin(e.x, e.y));

  const chance = e.type === 'grunt' ? 0.055 : (e.type === 'tank' || e.type === 'elite' ? 0.34 : 0.15);
  if (Math.random() < chance) powerups.push(new PowerUp(e.x, e.y, randomDrop()));
  else if (kills % 14 === 0 && player.power < 3) powerups.push(new PowerUp(e.x, e.y, 'P'));
}

function damageBoss(dmg) {
  if (!boss || boss.dying) return;
  boss.hp -= dmg; boss.flash = 0.05;
  if (boss.hp <= 0) {
    boss.hp = 0; boss.dying = 2.2;
    const v = addScore(5000 * level, false);
    floatText(boss.x, boss.y - 80, 'BOSS DESTROYED +' + v, '#ffcc00', 22);
    eBullets.forEach(b => sparks(b.x, b.y, b.color, 1));
    eBullets = [];
    sfx('bigexplode'); shake(20);
  }
}

function hitPlayer() {
  if (invulnerable > 0 || player.dead || player.shield > 0) return;
  lives--;
  player.power = Math.max(1, player.power - 1);
  comboCount = 0; comboTimer = 0;
  createExplosion(player.x, player.y, '#ff3333', 1.5);
  sfx('hurt'); shake(18); flashScreen('#ff0000', 0.45);
  invulnerable = 2.2;
  eBullets = eBullets.filter(b => Math.hypot(b.x - player.x, b.y - player.y) > 145);
  if (lives <= 0) {
    lives = 0; player.dead = true;
    createExplosion(player.x, player.y, '#ffaa00', 2.5);
    createExplosion(player.x, player.y, '#ffffff', 1.5);
    sfx('bigexplode'); shake(30);
    deathTimer = 1.8;
  }
}

function showGameOver() {
  gameState = STATE.OVER;
  $('hud').style.display = 'none';
  $('bottomHud').style.display = 'none';
  $('bossBar').style.display = 'none';
  const isNew = score > highScore;
  if (isNew) {
    highScore = score;
    try { localStorage.setItem('spaceShooterHigh', highScore); } catch (e) {}
  }
  $('newBest').style.display = isNew && score > 0 ? 'block' : 'none';
  $('finalScore').textContent = score.toLocaleString();
  $('bestOver').textContent = 'HIGH SCORE: ' + highScore.toLocaleString();
  $('stStage').textContent = level;
  $('stKills').textContent = kills;
  $('stCombo').textContent = maxCombo;
  $('gameOverScreen').style.display = 'flex';
  warpTarget = 0.3;
}

function spawnWave() {
  const lv = level;
  if (Math.random() < 0.22) {
    const n = 4 + Math.min(3, lv);
    const cx = rand(90, W - 90);
    for (let i = 0; i < n; i++) {
      enemies.push(new Enemy('grunt', cx, -40 - i * 42, {
        amp: Math.min(80, W * 0.18), speed: 150, freq: 1.6, t: -i * 0.28
      }));
    }
    return;
  }
  const w = {
    grunt: 48,
    diver: 8 + lv * 4,
    gunner: lv >= 2 ? 10 + lv * 3 : 6,
    tank: 6 + lv * 3,
    elite: lv >= 2 ? 4 + lv * 2 : 0
  };
  let total = 0;
  for (const k in w) total += w[k];
  let r = Math.random() * total, type = 'grunt';
  for (const k in w) { r -= w[k]; if (r <= 0) { type = k; break; } }
  enemies.push(new Enemy(type, rand(50, W - 50), -50));
}

function updateGame(dt) {
  gTime += dt;
  if (invulnerable > 0) invulnerable -= dt;
  if (overdriveActive > 0) overdriveActive = Math.max(0, overdriveActive - dt);
  shakeMag = Math.max(0, shakeMag - 45 * dt);
  if (flash.a > 0) flash.a -= dt * 2;
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;
  }

  player.update(dt);

  switch (phase) {
    case 'wave':
      spawnTimer -= dt;
      if (spawnTimer <= 0 && !player.dead) {
        spawnWave();
        spawnTimer = Math.max(0.35, 1.08 - level * 0.08) * rand(0.6, 1.35);
      }
      if (killsThisLevel >= killsNeeded()) {
        phase = 'warning'; phaseTimer = 3.2;
        showBanner('WARNING', 'BOSS APPROACHING', '#ff3344');
        sfx('warning');
      }
      break;
    case 'warning':
      phaseTimer -= dt;
      if (phaseTimer <= 0) {
        boss = new Boss(level);
        phase = 'boss';
        $('bossName').textContent = boss.name;
        $('bossBar').style.display = 'block';
      }
      break;
    case 'boss':
      if (level >= 2 && boss && !boss.dying && !boss.entering) {
        bossMinionTimer -= dt;
        if (bossMinionTimer <= 0) {
          enemies.push(new Enemy(Math.random() < 0.5 ? 'grunt' : 'diver', rand(50, W - 50), -40));
          bossMinionTimer = Math.max(1.8, 4 - level * 0.3);
        }
      }
      break;
    case 'clear':
      phaseTimer -= dt;
      if (phaseTimer <= 0) {
        level++; killsThisLevel = 0; phase = 'wave';
        spawnTimer = 1.2; warpTarget = 0;
        showBanner('STAGE ' + level, 'HYPER SECTOR', '#00e5ff');
      }
      break;
  }

  pBullets.forEach(b => b.update(dt));
  eBullets.forEach(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) b.active = false;
  });
  enemies.forEach(e => e.update(dt));
  powerups.forEach(p => p.update(dt));
  coins.forEach(c => c.update(dt));

  if (boss) {
    boss.update(dt);
    if (boss.dead) {
      for (let i = 0; i < 3; i++) powerups.push(new PowerUp(boss.x + rand(-60, 60), boss.y + rand(-20, 20), i === 0 ? 'P' : randomDrop()));
      powerups.push(new PowerUp(boss.x, boss.y, 'H'));
      for (let i = 0; i < 12; i++) coins.push(new Coin(boss.x + rand(-50, 50), boss.y + rand(-30, 30)));
      boss = null;
      $('bossBar').style.display = 'none';
      phase = 'clear'; phaseTimer = 4.4; warpTarget = 1.25;
      const bonus = 2000 * level;
      score += bonus;
      showBanner('STAGE CLEAR!', '+' + bonus.toLocaleString() + ' BONUS', '#3dff9e');
      sfx('clear');
    }
  }

  particles.forEach(p => p.update(dt));
  texts.forEach(t => { t.y -= 40 * dt; t.life -= dt; });

  // Player bullets vs enemies / boss
  for (const b of pBullets) {
    if (!b.active) continue;
    for (const e of enemies) {
      if (e.dead || b.hitSet.has(e)) continue;
      const r = e.size + 5;
      if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < r * r) {
        b.hitSet.add(e);
        if (b.pierce > 0) b.pierce--;
        else b.active = false;
        sparks(b.x, b.y, b.color, 3);
        sfx('hit');
        damageEnemy(e, b.dmg);
        if (!b.active) break;
      }
    }
    if (b.active && boss && !boss.dying && boss.hitTest(b.x, b.y)) {
      b.active = false;
      sparks(b.x, b.y, '#ffffff', 2);
      damageBoss(b.dmg);
      if (Math.random() < 0.3) sfx('hit');
    }
  }

  // Enemy bullets & enemies vs player
  if (!player.dead) {
    for (const b of eBullets) {
      if (!b.active) continue;
      const d = Math.hypot(b.x - player.x, b.y - player.y);
      if (player.shield > 0 && d < 45) {
        b.active = false;
        sparks(b.x, b.y, '#88eeff', 3);
        continue;
      }
      if (d < b.r + 6) {
        b.active = false;
        hitPlayer();
        if (player.dead) break;
        continue;
      }
      if (!b.grazed && d < 32 && invulnerable <= 0) {
        b.grazed = true;
        score += 25;
        addOverdrive(3.5);
        sparks(player.x + (b.x - player.x) * 0.5, player.y + (b.y - player.y) * 0.5, '#ffffff', 2);
        sfx('graze');
      }
    }
    for (const e of enemies) {
      if (e.dead) continue;
      const r = e.size * 0.8 + 12;
      if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 < r * r) {
        if (player.shield > 0 || overdriveActive > 0) { killEnemy(e); continue; }
        killEnemy(e);
        hitPlayer();
      }
    }
    if (boss && !boss.dying && boss.hitTest(player.x, player.y, -10)) hitPlayer();
  }

  pBullets = pBullets.filter(b => b.active);
  eBullets = eBullets.filter(b => b.active);
  enemies = enemies.filter(e => !e.dead && !e.gone);
  powerups = powerups.filter(p => !p.gone);
  coins = coins.filter(c => !c.gone);
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 900) particles.splice(0, particles.length - 900);
  texts = texts.filter(t => t.life > 0);

  if (deathTimer > 0) {
    deathTimer -= dt;
    if (deathTimer <= 0) showGameOver();
  }

  updateHUD();
}

let hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }

function updateHUD() {
  setText('score', score.toLocaleString());
  setText('stage', 'STAGE ' + level);
  setText('lives', lives > 0 ? '❤'.repeat(lives) : '✖');
  setText('bombCount', String(bombs));
  const prog = phase === 'wave' ? killsThisLevel / killsNeeded() : 1;
  const pw = Math.round(clamp(prog, 0, 1) * 100) + '%';
  if (hudCache.prog !== pw) { hudCache.prog = pw; $('stageFill').style.width = pw; }

  const effPow = overdriveActive > 0 ? 5 : player.power;
  if (hudCache.power !== effPow) {
    hudCache.power = effPow;
    [...$('powerPips').children].forEach((el, i) => el.classList.toggle('on', i < effPow));
  }

  const odPct = overdriveActive > 0 ? Math.round((overdriveActive / 6.5) * 100) : Math.round(overdrive);
  $('odFill').style.width = odPct + '%';
  setText('odBadge', overdriveActive > 0 ? 'ON' : (odPct >= 100 ? 'MAX' : odPct + '%'));
  $('btnOverdrive').classList.toggle('ready', overdrive >= 100 && overdriveActive <= 0);
  $('btnOverdrive').classList.toggle('empty', overdrive < 100 && overdriveActive <= 0);

  $('btnBomb').classList.toggle('empty', bombs <= 0);
  const m = multiplier();
  $('combo').classList.toggle('show', comboCount >= 3);
  setText('comboMul', 'x' + m);
  $('comboFill').style.width = (clamp(comboTimer / 2.6, 0, 1) * 100) + '%';
  if (boss) $('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%';
}

// ==================== RENDER ====================
function drawGame() {
  ctx.save();
  if (shakeMag > 0) ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);

  for (const p of particles) if (p.type === 'smoke') p.draw();
  coins.forEach(c => c.draw());
  powerups.forEach(p => p.draw());
  enemies.forEach(e => e.draw());
  if (boss) boss.draw();

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  pBullets.forEach(b => b.draw());
  ctx.globalCompositeOperation = 'source-over';

  if (player) player.draw();

  ctx.globalCompositeOperation = 'lighter';
  for (const b of eBullets) {
    drawGlow(b.color, b.x, b.y, b.r * 3);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, 6.283); ctx.fill();
  }
  for (const p of particles) if (p.type !== 'smoke') p.draw();
  ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 1.5, 0, 1);
    ctx.font = `900 ${t.size}px Orbitron, sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Warning / Low HP Vignette
  if (phase === 'warning' || (lives === 1 && player && !player.dead)) {
    const a = phase === 'warning' ? 0.35 + Math.sin(gTime * 10) * 0.25 : 0.16 + Math.sin(gTime * 4) * 0.08;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,0,0,0)');
    g.addColorStop(1, `rgba(255,0,35,${a})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // Overdrive Screen Edge Glow
  if (overdriveActive > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.38, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(0,255,180,0)');
    g.addColorStop(1, `rgba(0,255,180,${0.18 + Math.sin(gTime * 12) * 0.06})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (flash.a > 0) {
    ctx.globalAlpha = clamp(flash.a, 0, 1);
    ctx.fillStyle = flash.color;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function loop(ts) {
  const now = ts / 1000;
  let dt = lastTime ? now - lastTime : 0;
  lastTime = now;
  dt = Math.min(dt, 0.05);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(gameState === STATE.PAUSE ? 0 : dt);

  if (gameState === STATE.PLAY) {
    updateGame(dt);
    drawGame();
  } else if (gameState === STATE.PAUSE) {
    drawGame();
  } else if (gameState === STATE.OVER) {
    gTime += dt;
    particles.forEach(p => p.update(dt));
    particles = particles.filter(p => p.life > 0);
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => p.draw());
    ctx.globalCompositeOperation = 'source-over';
  } else {
    gTime += dt;
  }

  requestAnimationFrame(loop);
}

$('bestMenu').textContent = 'HIGH SCORE: ' + highScore.toLocaleString();
requestAnimationFrame(loop);
</script>
</body>
